[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stylematch"
version = "0.1.0"
description = "GPT RAG vs TF-IDF fashion recommender, head to head"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
sentence-transformers = ["sentence-transformers>=2.6"]
dev = ["pytest>=8"]

[project.scripts]
stylematch = "stylematch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
